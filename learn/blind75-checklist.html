<style>

    --bg: #F8F8F6;
    --surface: #FFFFFF;
    --surface2: #F2F2F0;
    --border: #E8E8E4;
    --accent: #2D6BE4;

    --green-glow: rgba(34, 197, 94, 0.12);
    --red: #EF4444;
    --yellow: #F59E0B;
    --text: #1A1A18;
    --muted: #6B6B65;
    --mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
    --sans: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --radius: 14px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1117;
      --surface: #1A1D27;
      --surface2: #232638;
      --border: #2E3247;
      --accent: #6C63FF;
      --accent-glow: rgba(108,99,255,0.18);
      --green: #00D4AA;
      --green-glow: rgba(0,212,170,0.15);
      --red: #FF6B6B;
      --yellow: #FFD166;
      --text: #E8EAF0;
      --muted: #7A7F9A;
    }
  }

  body.dark-mode {
    --bg: #0F1117;
    --surface: #1A1D27;
    --surface2: #232638;
    --border: #2E3247;
    --accent: #6C63FF;
    --accent-glow: rgba(108,99,255,0.18);
    --green: #00D4AA;
    --green-glow: rgba(0,212,170,0.15);
    --red: #FF6B6B;
    --yellow: #FFD166;
    --text: #E8EAF0;
    --muted: #7A7F9A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

    /* HEADER NAV */
  .dayflow-nav-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;

  }
  .nav-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    transition: all 0.2s ease;
    font-family: var(--sans);
  }
  .nav-back-btn:hover {

    border-color: var(--accent);

  }
  .nav-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }
  .nav-subtitle {
    font-size: 12px;
    color: var(--muted);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 500;
  }
  .nav-right {
    width: 80px;
  }

  /* HEADER */
  header {
    padding: 36px 24px 28px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';

    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    pointer-events: none;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 600;
  }

  h1 {
    font-family: var(--sans);
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    font-weight: 400;
    max-width: 480px;
    margin: 0 auto 28px;
  }
  header {
    padding: 48px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;

    pointer-events: none;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: var(--sans);
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 15px;
    font-weight: 400;
    max-width: 480px;
    margin: 0 auto 32px;
  }

  /* PROGRESS RING */
  .progress-hub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .ring-wrap {
    position: relative;
    width: 120px; height: 120px;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 8; }
  .ring-fill {
    fill: none;
    stroke: url(#ringGrad);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
  }
  .ring-num {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
  }
  .ring-total {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .stats-row {
    display: flex;
    gap: 24px;
  }
  .stat-chip {
    text-align: center;
  }
  .stat-val {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 600;
  }
  .stat-val.easy { color: var(--green); }
  .stat-val.medium { color: var(--yellow); }
  .stat-val.hard { color: var(--red); }
  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  /* SEARCH & FILTER */
  .controls {
    max-width: 860px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--muted); }

  .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    font-family: var(--sans);
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
  .filter-btn.active-done { background: var(--green-glow); border-color: var(--green); color: var(--green); }

  /* MAIN */
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  /* CATEGORY */
  .category {
    margin-bottom: 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
  }

  .cat-header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    gap: 14px;
    transition: background 0.15s;
  }
  .cat-header:hover { background: rgba(255,255,255,0.03); }

  .cat-icon {
    font-size: 20px;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface2);
    border-radius: 8px;
    flex-shrink: 0;
  }

  .cat-info { flex: 1; }
  .cat-name {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }
  .cat-meta {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
    margin-top: 2px;
  }

  .cat-progress-bar {
    width: 80px;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .cat-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .cat-chevron {
    color: var(--muted);
    font-size: 14px;
    transition: transform 0.25s;
    flex-shrink: 0;
  }
  .cat-chevron.open { transform: rotate(90deg); }

  /* QUESTIONS LIST */
  .questions {
    display: none;
    border-top: 1px solid var(--border);
  }
  .questions.open { display: block; }

  /* QUESTION ROW */
  .q-row {
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .q-row:last-child { border-bottom: none; }
  .q-row.done .q-title-text { text-decoration: line-through; color: var(--muted); }

  .q-main {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    gap: 14px;
    cursor: pointer;
  }
  .q-main:hover { background: rgba(255,255,255,0.02); }

  .q-check {
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    position: relative;
    z-index: 2;
  }
  .q-check:hover { border-color: var(--green); }
  .q-check.done {
    background: var(--green);
    border-color: var(--green);
  }
  .q-check.done::after {
    content: '✓';
    color: #0F1117;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
  }

  .q-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    width: 24px;
    flex-shrink: 0;
    text-align: right;
  }

  .q-title-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s;
  }

  .diff-badge {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.05em;
    flex-shrink: 0;
  }
  .diff-easy { background: rgba(0,212,170,0.12); color: var(--green); }
  .diff-medium { background: rgba(255,209,102,0.12); color: var(--yellow); }
  .diff-hard { background: rgba(255,107,107,0.12); color: var(--red); }

  .q-chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .q-chevron.open { transform: rotate(90deg); }

  /* EXPANDED DETAIL */
  .q-detail {
    display: none;
    padding: 0 20px 20px 78px;
    animation: fadeIn 0.2s ease;
  }
  .q-detail.open { display: block; }

  @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: translateY(0); } }

  .q-description {
    font-size: 13.5px;
    color: #b0b5cc;
    line-height: 1.75;
    margin-bottom: 16px;
    padding: 16px;
    background: var(--surface2);
    border-radius: 10px;
    border-left: 3px solid var(--accent);
  }

  .solution-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    font-family: var(--sans);
    transition: all 0.18s;
    margin-bottom: 0;
  }
  .solution-toggle:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
  .solution-toggle .arrow { margin-left: auto; transition: transform 0.2s; }
  .solution-toggle.open .arrow { transform: rotate(90deg); }

  .solution-content {
    display: none;
    margin-top: 12px;
    padding: 16px;
    background: #12141e;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .solution-content.open { display: block; }

  .solution-content h4 {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .solution-content p {
    font-size: 13px;
    color: #9fa5c0;
    line-height: 1.7;
    margin-bottom: 10px;
  }

  .code-block {
    background: #0a0c13;
    border-radius: 8px;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: #c9d1d9;
    overflow-x: auto;
    line-height: 1.6;
    border: 1px solid #1e2133;
    margin-top: 10px;
    white-space: pre;
  }

  .kw { color: #7C6BFF; }
  .fn { color: #79c0ff; }
  .str { color: #a5d6ff; }
  .cm { color: #484f58; }
  .num { color: #00D4AA; }

  .complexity {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .cx-tag {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--surface2);
    color: var(--muted);
  }
  .cx-tag span { color: var(--text); font-weight: 600; }

  .action-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn-solve {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.18s, transform 0.1s;
    font-family: var(--sans);
  }
  .btn-solve:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-mark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    background: transparent;
    color: var(--green);
    border: 1px solid var(--green);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s;
    font-family: var(--sans);
  }
  .btn-mark:hover { background: var(--green-glow); }
  .btn-mark.done { background: var(--green); color: #0F1117; }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* FOOTER */
  footer {
    text-align: center;
    padding: 20px;
    color: var(--muted);
    font-size: 12px;
    font-family: var(--mono);
    border-top: 1px solid var(--border);
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
const categories = [
  {
    name: "Arrays & Hashing", icon: "🔢",
    questions: [
      {
        id: 1, title: "Two Sum", diff: "easy",
        lc: "https://leetcode.com/problems/two-sum/",
        desc: "Given an array of integers nums and an integer target, return indices of the two numbers such that they add up to target. You may assume that each input would have exactly one solution, and you may not use the same element twice.",
        approach: "Use a HashMap to store each number and its index. For each element nums[i], check if target - nums[i] exists in the map for O(n) time and O(n) space.",
        code: `<span class="kw">public</span> <span class="kw">int</span>[] twoSum(<span class="kw">int</span>[] nums, <span class="kw">int</span> target) {
    <span class="ty">Map</span>&lt;<span class="ty">Integer</span>, <span class="ty">Integer</span>&gt; map = <span class="kw">new</span> <span class="ty">HashMap</span>&lt;&gt;();
    <span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; nums.length; i++) {
        <span class="kw">int</span> diff = target - nums[i];
        <span class="kw">if</span> (map.containsKey(diff)) {
            <span class="kw">return</span> <span class="kw">new</span> <span class="kw">int</span>[]{map.get(diff), i};
        }
        map.put(nums[i], i);
    }
    <span class="kw">return</span> <span class="kw">new</span> <span class="kw">int</span>[]{};
}`,
        time: "O(n)", space: "O(n)"
      },
      {
        id: 2, title: "Contains Duplicate", diff: "easy",
        lc: "https://leetcode.com/problems/contains-duplicate/",
        desc: "Given an integer array nums, return true if any value appears at least twice in the array, and return false if every element is distinct.",

// Total question count check
const totalQ = categories.reduce((s,c) => s+c.questions.length, 0);

// ─── STATE & BE CREATOR SYNC ──────────────────────────────────────────────────
const DB_KEY = 'becreator_v1';
const STORAGE_KEY = 'blind75_done_v1';

function loadAppState() {
  try {
    let s = localStorage.getItem(DB_KEY);
    if (!s) s = localStorage.getItem('dayflow_v1');
    return s ? JSON.parse(s) : {};
  } catch(e) { return {}; }
}

function saveAppState(appState) {
  try { localStorage.setItem(DB_KEY, JSON.stringify(appState)); } catch(e) {}
}

function loadInitialDone() {
  try {
    const appState = loadAppState();
    const enrollment = appState.learning?.enrollments?.blind75;
    if (enrollment && Array.isArray(enrollment.completed) && enrollment.completed.length > 0) {
      return new Set(enrollment.completed);
    }
  } catch(e) {}
  try {
    return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
  } catch(e) { return new Set(); }
}

let done = loadInitialDone();
let openCats = new Set();
let openDetails = new Set();
let openSolutions = new Set();
let currentFilter = 'all';

function saveDone() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...done]));
  
  const appState = loadAppState();
  if (!appState.learning) appState.learning = { enrollments: {} };
  if (!appState.learning.enrollments) appState.learning.enrollments = {};
  
  const completedIds = Array.from(done);
  const pct = Math.round((completedIds.length / 75) * 100);
  
  appState.learning.enrollments.blind75 = {
    enrolled: true,
    enrolledDate: appState.learning.enrollments.blind75?.enrolledDate || new Date().toISOString().split('T')[0],
    completed: completedIds,
    progress: pct,
    lastStudied: new Date().toISOString()
  };
  saveAppState(appState);
}

function toggleDone(id) {
  if (done.has(id)) {
    done.delete(id);
  } else {
    done.add(id);
    // Collapse only the completed question detail card
    openDetails.delete(id);
    openSolutions.delete(id);
  }
  
  // Ensure the parent category stays OPEN
  const cat = categories.find(c => c.questions.some(q => q.id === id));
  if (cat) openCats.add(cat.name);
  
  saveDone();
  renderAll();
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderAll() {
  updateProgress();
  const query = document.getElementById('searchInput').value.toLowerCase();
  const main = document.getElementById('main');
  main.innerHTML = '';

  let anyVisible = false;

  categories.forEach(cat => {
    const visibleQs = cat.questions.filter(q => {
      const matchSearch = !query || q.title.toLowerCase().includes(query) || q.desc.toLowerCase().includes(query);
      const matchFilter = currentFilter === 'all' ||
        (currentFilter === 'done' && done.has(q.id)) ||
        (currentFilter === 'todo' && !done.has(q.id));
      return matchSearch && matchFilter;
    });

    if (visibleQs.length === 0) return;
    anyVisible = true;

    const catDone = cat.questions.filter(q => done.has(q.id)).length;
    const catTotal = cat.questions.length;
    const pct = Math.round((catDone / catTotal) * 100);

    const isOpen = openCats.has(cat.name) || Boolean(query);

    const catEl = document.createElement('div');
    catEl.className = 'category';
    const escapedName = cat.name.replace(/'/g, "\'");
    catEl.innerHTML = `
      <div class="cat-header" onclick="toggleCat(this, '${escapedName}')">
        <div class="cat-icon">${cat.icon}</div>
        <div class="cat-info">
          <div class="cat-name">${cat.name}</div>
          <div class="cat-meta">${catDone}/${catTotal} solved</div>
        </div>
        <div class="cat-progress-bar"><div class="cat-progress-fill" style="width:${pct}%"></div></div>
        <span class="cat-chevron${isOpen ? ' open' : ''}">▶</span>
      </div>
      <div class="questions${isOpen ? ' open' : ''}">
        ${visibleQs.map(q => renderQuestion(q)).join('')}
      </div>
    `;
    main.appendChild(catEl);
  });

  if (!anyVisible) {
    main.innerHTML = `<div class="empty-state"><div class="icon">🔎</div><div>No problems match your filter.</div></div>`;
  }
}

function renderQuestion(q) {
  const isDone = done.has(q.id);
  const isDetailOpen = openDetails.has(q.id);
  const isSolOpen = openSolutions.has(q.id);
  return `
    <div class="q-row${isDone ? ' done' : ''}" id="qrow-${q.id}">
      <div class="q-main" onclick="toggleDetail(${q.id}, event)">
        <div class="q-check${isDone ? ' done' : ''}" onclick="event.stopPropagation(); toggleDone(${q.id})"></div>
        <span class="q-num">${q.id}</span>
        <span class="q-title-text">${q.title}</span>
        <span class="diff-badge diff-${q.diff}">${q.diff}</span>
        <span class="q-chevron${isDetailOpen ? ' open' : ''}" id="chev-${q.id}">▶</span>
      </div>
      <div class="q-detail${isDetailOpen ? ' open' : ''}" id="detail-${q.id}">
        <div class="q-description">${q.desc}</div>
        <button class="solution-toggle${isSolOpen ? ' open' : ''}" onclick="toggleSolution(${q.id}, this)">
          <span>💡 Show Solution & Approach</span>
          <span class="arrow">▶</span>
        </button>
        <div class="solution-content${isSolOpen ? ' open' : ''}" id="sol-${q.id}">
          <h4>// approach</h4>
          <p>${q.approach}</p>
          <div class="code-block">${q.code}</div>
          <div class="complexity">
            <div class="cx-tag">Time: <span>${q.time}</span></div>
            <div class="cx-tag">Space: <span>${q.space}</span></div>
          </div>
        </div>
        <div class="action-row">
          <a class="btn-solve" href="${q.lc}" target="_blank">🔗 Solve on LeetCode</a>
          <button class="btn-mark${isDone ? ' done' : ''}" onclick="toggleDone(${q.id})">
            ${isDone ? '✓ Completed' : '○ Mark Complete'}
          </button>
        </div>
      </div>
    </div>
  `;
}

function updateProgress() {
  const total = done.size;
  const circ = 327; // 2π × 52
  const offset = circ - (total / 75) * circ;
  const ring = document.getElementById('progressRing');
  if (ring) ring.style.strokeDashoffset = offset;
  const doneCnt = document.getElementById('doneCount');
  if (doneCnt) doneCnt.textContent = total;

  let easy = 0, med = 0, hard = 0;
  categories.forEach(cat => cat.questions.forEach(q => {
    if (!done.has(q.id)) return;
    if (q.diff === 'easy') easy++;
    else if (q.diff === 'medium') med++;
    else hard++;
  }));
  const eEl = document.getElementById('easyDone');
  if (eEl) eEl.textContent = easy;
  const mEl = document.getElementById('medDone');
  if (mEl) mEl.textContent = med;
  const hEl = document.getElementById('hardDone');
  if (hEl) hEl.textContent = hard;
}

// ─── INTERACTIONS ─────────────────────────────────────────────────────────────
function toggleCat(header, catName) {
  const qs = header.nextElementSibling;
  const chev = header.querySelector('.cat-chevron');
  const isOpen = qs.classList.toggle('open');
  chev.classList.toggle('open', isOpen);
  if (catName) {
    if (isOpen) openCats.add(catName);
    else openCats.delete(catName);
  }
}

function toggleDetail(id, e) {
  const detail = document.getElementById(`detail-${id}`);
  const chev = document.getElementById(`chev-${id}`);
  if (!detail) return;
  const isOpen = detail.classList.toggle('open');
  if (chev) chev.classList.toggle('open', isOpen);
  if (isOpen) openDetails.add(id);
  else openDetails.delete(id);
}

function toggleSolution(id, btn) {
  const sol = document.getElementById(`sol-${id}`);
  if (!sol) return;
  const isOpen = sol.classList.toggle('open');
  if (btn) btn.classList.toggle('open', isOpen);
  if (isOpen) openSolutions.add(id);
  else openSolutions.delete(id);
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.remove('active', 'active-done');
    b.style.borderColor = '';
    b.style.color = '';
  });
  if (f === 'done') {
    btn.style.borderColor = 'var(--green)';
    btn.style.color = 'var(--green)';
    btn.style.background = 'var(--green-glow)';
  } else {
    btn.classList.add('active');
  }
  renderAll();
}

function filterQuestions() { renderAll(); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Deep Dive Roadmap — BeCreator Learn</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F8F8F6;
    --surface: #FFFFFF;
    --surface2: #F2F2F0;
    --border: #E8E8E4;
    --accent: #E25C1A;
    --accent-glow: rgba(226, 92, 26, 0.12);
    --green: #22C55E;
    --green-glow: rgba(34, 197, 94, 0.12);
    --red: #EF4444;
    --yellow: #F59E0B;
    --purple: #8B5CF6;
    --text: #1A1A18;
    --muted: #6B6B65;
    --mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
    --sans: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    --radius: 14px;
    --radius-sm: 8px;
  }

  body.dark-mode {
    --bg: #0F1117;
    --surface: #1A1D27;
    --surface2: #232638;
    --border: #2E3247;
    --accent: #FF6B35;
    --accent-glow: rgba(255, 107, 53, 0.18);
    --green: #00D4AA;
    --green-glow: rgba(0,212,170,0.15);
    --red: #FF6B6B;
    --yellow: #FFD166;
    --text: #E8EAF0;
    --muted: #7A7F9A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* HEADER NAV */
  .dayflow-nav-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .nav-back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .nav-back-btn:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateX(-2px);
  }
  .nav-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }
  .theme-toggle-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 16px;
  }
  .theme-toggle-btn:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
  }

  /* HERO HEADER */
  header {
    padding: 48px 24px 32px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -80px; left: 50%;
    transform: translateX(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 65%);
    pointer-events: none;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(28px, 4.5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14.5px;
    font-weight: 400;
    max-width: 600px;
    margin: 0 auto 32px;
  }

  /* PROGRESS RING */
  .progress-hub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .ring-wrap {
    position: relative;
    width: 120px; height: 120px;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 8; }
  .ring-fill {
    fill: none;
    stroke: var(--accent);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .ring-label {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
  }
  .ring-num { font-size: 26px; font-weight: 700; color: var(--text); line-height: 1; }
  .ring-total { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .stats-row { display: flex; gap: 24px; }
  .stat-chip { text-align: center; }
  .stat-val { font-family: var(--mono); font-size: 22px; font-weight: 600; }
  .stat-val.easy { color: var(--green); }
  .stat-val.medium { color: var(--yellow); }
  .stat-val.hard { color: var(--red); }
  .stat-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 2px; }

  /* SEARCH & TAB CONTROLS */
  .controls {
    max-width: 1000px;
    margin: 28px auto 0;
    padding: 0 24px;
  }
  .view-tabs {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
  }
  .tab-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent-glow);
    color: var(--accent);
  }

  /* MODULE GRID */
  .modules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    max-width: 1000px;
    margin: 0 auto 80px;
    padding: 0 24px;
  }

  .module-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    text-decoration: none;
    color: inherit;
  }
  .module-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.06);
  }

  .mod-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .mod-icon {
    font-size: 28px;
    background: var(--surface2);
    width: 48px; height: 48px;
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .mod-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .mod-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 16px;
    flex: 1;
  }
  .mod-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .mod-progress-bar {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .mod-progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.4s ease;
  }
  .open-mod-btn {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    font-weight: 700;
    padding: 10px;
    border-radius: var(--radius-sm);
    text-align: center;
    transition: all 0.2s;
  }
  .module-card:hover .open-mod-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFF;
  }

  /* ALL TOPICS CONTAINER */
  #allTopicsContainer {
    max-width: 1000px;
    margin: 0 auto 80px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.2s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .q-card:hover { border-color: var(--muted); }
  .q-card.done { border-left: 4px solid var(--green); }

  .q-header {
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    gap: 16px;
    user-select: none;
  }
  .q-header-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
  }
  .q-checkbox {
    width: 20px; height: 20px;
    accent-color: var(--green);
    cursor: pointer;
  }
  .q-num {
    font-family: var(--mono);
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    background: var(--surface2);
    padding: 4px 8px;
    border-radius: var(--radius-sm);
  }
  .q-title {
    font-weight: 700; font-size: 16px;
    color: var(--text); line-height: 1.4;
  }
  .diff-badge {
    font-size: 11px; font-weight: 700;
    padding: 4px 10px; border-radius: 12px;
    text-transform: uppercase;
  }
  .diff-badge.Easy { background: rgba(34, 197, 94, 0.15); color: var(--green); }
  .diff-badge.Medium { background: rgba(245, 158, 11, 0.15); color: var(--yellow); }
  .diff-badge.Hard { background: rgba(239, 68, 68, 0.15); color: var(--red); }

  .q-body {
    padding: 0 24px 24px;
    border-top: 1px solid var(--border);
    display: none;
  }
  .q-card.open .q-body { display: block; }

  .ans-prose { font-size: 14.5px; color: var(--text); margin-top: 16px; line-height: 1.65; }
  .ans-bullets { margin: 12px 0 16px 20px; color: var(--text); font-size: 14px; }
  .ans-bullets li { margin-bottom: 6px; }

  .table-container {
    overflow-x: auto; margin: 16px 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  .ans-table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
  .ans-table th { background: var(--surface2); color: var(--text); font-weight: 700; padding: 10px 14px; border-bottom: 2px solid var(--border); }
  .ans-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
  .ans-table tr:last-child td { border-bottom: none; }

  .code-container { position: relative; margin: 16px 0; }
  pre {
    background: #111827; color: #F9FAFB;
    padding: 16px 20px; border-radius: var(--radius-sm);
    font-family: var(--mono); font-size: 13px;
    overflow-x: auto; line-height: 1.5;
  }
  .copy-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(255,255,255,0.15); border: none;
    color: #FFF; font-size: 11px; font-weight: 600;
    padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }

  .ans-note {
    background: var(--accent-glow);
    border-left: 3px solid var(--accent);
    padding: 12px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin: 16px 0; font-size: 13.5px; color: var(--text);
  }

  .q-actions {
    display: flex; justify-content: flex-end;
    margin-top: 20px; padding-top: 14px;
    border-top: 1px dashed var(--border);
  }
  .toggle-done-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-weight: 600;
    padding: 8px 18px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .q-card.done .toggle-done-btn {
    background: var(--green-glow); border-color: var(--green); color: var(--green);
  }
</style>
</head>
<body>

<div class="dayflow-nav-header">
  <a href="../index.html" class="nav-back-btn">← Learn</a>
  <div class="nav-title">☕ JDDR</div>
  <button class="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
</div>

<header>
  <div class="eyebrow">BeCreator Learn • Java Track</div>
  <h1>Java Deep Dive Roadmap</h1>
  <div class="subtitle">Master 1,270+ microtopics across 15 modular learning paths with comparison tables, code blocks, and detailed technical notes.</div>

  <div class="progress-hub">
    <div class="ring-wrap">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="50" />
        <circle class="ring-fill" id="ringCircle" cx="60" cy="60" r="50" stroke-dasharray="314.15" stroke-dashoffset="314.15" />
      </svg>
      <div class="ring-label">
        <span class="ring-num" id="ringNum">0%</span>
        <span class="ring-total" id="ringTotal">0/1270</span>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-chip">
        <div class="stat-val easy" id="statEasy">0/0</div>
        <div class="stat-lbl">Easy</div>
      </div>
      <div class="stat-chip">
        <div class="stat-val medium" id="statMedium">0/0</div>
        <div class="stat-lbl">Medium</div>
      </div>
      <div class="stat-chip">
        <div class="stat-val hard" id="statHard">0/0</div>
        <div class="stat-lbl">Hard</div>
      </div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="view-tabs">
    <button class="tab-btn active" id="tabModules" onclick="switchView('modules')">📚 15 Modular Paths</button>
    <button class="tab-btn" id="tabAll" onclick="switchView('all')">🔍 All 1,272 Topics</button>
  </div>
</div>

<!-- MODULES GRID VIEW -->
<div class="modules-grid" id="modulesGrid"></div>

<!-- ALL TOPICS VIEW -->
<div id="allTopicsContainer" style="display: none;"></div>

<script src="course_data.js"></script>
<script>
  const MODULE_CONFIG = [
    { id: "module01_core_java", file: "module01_core_java.html", title: "Module 01: Core Java & Fundamentals", category: "Core Java & Fundamentals", icon: "☕", desc: "Primitives vs Objects, String internals, memory layout, equals/hashCode contract, immutability, enums, nested classes & reflection." },
    { id: "module02_oops_design_patterns", file: "module02_oops_design_patterns.html", title: "Module 02: OOPs & Design Patterns", category: "OOPs & Design Patterns", icon: "📐", desc: "SOLID principles, GoF design patterns (Singleton, Factory, Builder, Strategy, Decorator, Proxy), Encapsulation & Polymorphism." },
    { id: "module03_modern_java", file: "module03_modern_java.html", title: "Module 03: Modern Java Features (Java 8 - 21+)", category: "Modern Java Features (Java 8 - 21+)", icon: "🚀", desc: "Lambdas, Streams, Optional, Records, Sealed Classes, Switch Expressions, Pattern Matching & Sequenced Collections." },
    { id: "module04_collections", file: "module04_collections.html", title: "Module 04: Collections Framework & Internals", category: "Collections Framework & Internals", icon: "📦", desc: "HashMap internals, Red-Black Trees, ConcurrentHashMap, ArrayList capacity growth, PriorityQueue heap & Fail-fast vs Fail-safe." },
    { id: "module05_generics", file: "module05_generics.html", title: "Module 05: Generics & Type System", category: "Generics & Type System", icon: "🧬", desc: "PECS principle (? extends T vs ? super T), Type Erasure, Bridge Methods, Bounded Type Parameters & Wildcards." },
    { id: "module06_exceptions_io", file: "module06_exceptions_io.html", title: "Module 06: Exception Handling & I/O / NIO", category: "Exception Handling & I/O / NIO", icon: "🛡️", desc: "AutoCloseable, Try-With-Resources, Checked vs Unchecked exceptions, Channels, Buffers, Selectors & NIO.2 Files API." },
    { id: "module07_multithreading", file: "module07_multithreading.html", title: "Module 07: Multithreading & Java Concurrency", category: "Multithreading & Java Concurrency", icon: "⚡", desc: "Synchronized, Volatile, JMM happens-before rules, CAS lock-free atomic variables, ReentrantLock, CountDownLatch & Executors." },
    { id: "module08_virtual_threads", file: "module08_virtual_threads.html", title: "Module 08: Virtual Threads & Concurrency", category: "Virtual Threads & Concurrency", icon: "🧵", desc: "Project Loom, Carrier threads, Unmounting vs Pinning, ThreadLocal leakage risks, ScopedValue & StructuredTaskScope." },
    { id: "module09_jvm_performance", file: "module09_jvm_performance.html", title: "Module 09: JVM Architecture & Memory Tuning", category: "JVM Architecture & Memory Tuning", icon: "⚙️", desc: "Metaspace, Classloaders, JIT C1/C2 compilers, Escape Analysis, G1 GC, ZGC, Shenandoah, Memory Leaks, JFR & Heap Dumps." },
    { id: "module10_spring_core", file: "module10_spring_core.html", title: "Module 10: Spring Boot & Spring Framework", category: "Spring Boot & Spring Framework", icon: "🌱", desc: "Spring IoC container, Bean lifecycle hooks, BeanPostProcessor, AOP dynamic proxies (JDK vs CGLIB) & @Transactional propagation." },
    { id: "module11_spring_jpa", file: "module11_spring_jpa.html", title: "Module 11: Spring Data JPA & Hibernate ORM", category: "Spring Data JPA & Hibernate ORM", icon: "🗄️", desc: "Entity Lifecycle states, N+1 Select problem, JOIN FETCH, EntityGraph, L1/L2 Cache, Optimistic vs Pessimistic locking & HikariCP pool." },
    { id: "module12_spring_security", file: "module12_spring_security.html", title: "Module 12: Spring Security & Web Security", category: "Spring Security & Web Security", icon: "🔒", desc: "SecurityFilterChain, OAuth2 PKCE authorization flows, JWT generation & validation, CSRF, BCrypt & OWASP Top 10 mitigations." },
    { id: "module13_webflux_apis", file: "module13_webflux_apis.html", title: "Module 13: REST APIs, WebFlux & Microservices", category: "REST APIs, WebFlux & Microservices", icon: "🌐", desc: "DispatcherServlet lifecycle, Spring WebFlux Reactor Mono/Flux, Backpressure, GraphQL schema mapping & gRPC Protobuf streaming." },
    { id: "module14_distributed_systems", file: "module14_distributed_systems.html", title: "Module 14: Distributed Systems & Event-Driven Architecture", category: "Distributed Systems & Event-Driven Architecture", icon: "🛰️", desc: "Kafka Partitions/Offsets, Consumer Groups, Redis Data Structures & Pub/Sub, Resilience4j Circuit Breaker, Saga & Outbox patterns." },
    { id: "module15_testing_cloud", file: "module15_testing_cloud.html", title: "Module 15: Testing, Observability & Cloud Native", category: "Testing, Observability & Cloud Native", icon: "📊", desc: "JUnit 5, Mockito, Testcontainers, ArchUnit, Micrometer metrics, Prometheus, Grafana, Docker containerization & AWS Cloud SDK." }
  ];

  let QUESTIONS_DATA = window.JAVA_IN_DETAILS_DATA || [];
  let doneSet = new Set();
  let currentView = 'modules';

  function loadProgress() {
    try {
      const raw = localStorage.getItem('java_in_details_done_v1');
      if (raw) {
        const arr = JSON.parse(raw);
        if (Array.isArray(arr)) doneSet = new Set(arr);
      }
    } catch(e) {}
  }

  function saveProgress() {
    try {
      const arr = Array.from(doneSet);
      localStorage.setItem('java_in_details_done_v1', JSON.stringify(arr));
      if (window.parent && typeof window.parent.syncLearnState === 'function') {
        window.parent.syncLearnState();
      }
    } catch(e) {}
  }

  function updateStats() {
    const total = QUESTIONS_DATA.length;
    const doneCount = doneSet.size;
    const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

    const circle = document.getElementById('ringCircle');
    if (circle) {
      const circumference = 314.15;
      const offset = circumference - (pct / 100) * circumference;
      circle.style.strokeDashoffset = offset;
    }

    document.getElementById('ringNum').textContent = `${pct}%`;
    document.getElementById('ringTotal').textContent = `${doneCount}/${total}`;

    const easyTotal = QUESTIONS_DATA.filter(q => q.difficulty === 'Easy');
    const easyDone = easyTotal.filter(q => doneSet.has(q.id)).length;
    document.getElementById('statEasy').textContent = `${easyDone}/${easyTotal.length}`;

    const medTotal = QUESTIONS_DATA.filter(q => q.difficulty === 'Medium');
    const medDone = medTotal.filter(q => doneSet.has(q.id)).length;
    document.getElementById('statMedium').textContent = `${medDone}/${medTotal.length}`;

    const hardTotal = QUESTIONS_DATA.filter(q => q.difficulty === 'Hard');
    const hardDone = hardTotal.filter(q => doneSet.has(q.id)).length;
    document.getElementById('statHard').textContent = `${hardDone}/${hardTotal.length}`;
  }

  function renderModulesGrid() {
    const container = document.getElementById('modulesGrid');
    container.innerHTML = MODULE_CONFIG.map(mod => {
      const modTopics = QUESTIONS_DATA.filter(q => q.category === mod.category);
      const doneCount = modTopics.filter(q => doneSet.has(q.id)).length;
      const totalCount = modTopics.length;
      const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;

      return `
        <a class="module-card" href="modules/${mod.file}">
          <div>
            <div class="mod-header">
              <div class="mod-icon">${mod.icon}</div>
              <div class="mod-title">${mod.title}</div>
            </div>
            <div class="mod-desc">${mod.desc}</div>
          </div>
          <div>
            <div class="mod-meta">
              <span>${totalCount} Microtopics</span>
              <span>${pct}% Completed</span>
            </div>
            <div class="mod-progress-bar">
              <div class="mod-progress-fill" style="width: ${pct}%;"></div>
            </div>
            <div class="open-mod-btn">Study Module →</div>
          </div>
        </a>
      `;
    }).join('');
  }

  function switchView(view) {
    currentView = view;
    document.getElementById('tabModules').classList.toggle('active', view === 'modules');
    document.getElementById('tabAll').classList.toggle('active', view === 'all');

    if (view === 'modules') {
      document.getElementById('modulesGrid').style.display = 'grid';
      document.getElementById('allTopicsContainer').style.display = 'none';
      renderModulesGrid();
    } else {
      document.getElementById('modulesGrid').style.display = 'none';
      document.getElementById('allTopicsContainer').style.display = 'flex';
      renderAllTopics();
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatMarkdown(str) {
    if (!str) return '';
    let esc = escapeHtml(str);
    esc = esc.replace(/\*\*(.*?)\*\*/g, '<strong style="color: var(--accent); font-weight:700;">$1</strong>');
    esc = esc.replace(/`([^`]+)`/g, '<code style="background:var(--surface2); padding:2px 6px; border-radius:4px; font-family:var(--mono); font-size:12px;">$1</code>');
    return esc;
  }

  function formatParsedAnswer(parsedAnswer) {
    if (!parsedAnswer || !parsedAnswer.length) return '<p class="ans-prose">No detailed explanation provided.</p>';
    let html = '';
    parsedAnswer.forEach(part => {
      if (part.type === 'code') {
        html += `
          <div class="code-container">
            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
            <pre><code>${escapeHtml(part.content)}</code></pre>
          </div>
        `;
      } else if (part.type === 'table') {
        html += `
          <div class="table-container">
            <table class="ans-table">
              <thead><tr>${part.headers.map(h => `<th>${formatMarkdown(h)}</th>`).join('')}</tr></thead>
              <tbody>${part.rows.map(row => `<tr>${row.map(cell => `<td>${formatMarkdown(cell)}</td>`).join('')}</tr>`).join('')}</tbody>
            </table>
          </div>
        `;
      } else if (part.type === 'bullet_list') {
        html += `<ul class="ans-bullets">${part.items.map(item => `<li>${formatMarkdown(item)}</li>`).join('')}</ul>`;
      } else if (part.type === 'note') {
        html += `<div class="ans-note">💡 <strong>Note:</strong> ${formatMarkdown(part.content)}</div>`;
      } else {
        html += `<p class="ans-prose">${formatMarkdown(part.content)}</p>`;
      }
    });
    return html;
  }

  function renderAllTopics() {
    const container = document.getElementById('allTopicsContainer');
    container.innerHTML = QUESTIONS_DATA.map(q => {
      const isDone = doneSet.has(q.id);
      const answerHtml = formatParsedAnswer(q.parsed_answer);

      return `
        <div class="q-card ${isDone ? 'done' : ''}" id="card-${q.id}">
          <div class="q-header" onclick="toggleCard('${q.id}')">
            <div class="q-header-left">
              <input type="checkbox" class="q-checkbox" ${isDone ? 'checked' : ''} onclick="toggleDone('${q.id}', event)">
              <span class="q-num">#${q.num}</span>
              <div class="q-title">${q.title}</div>
            </div>
            <div class="q-meta">
              <span class="q-cat">${q.category}</span>
              <span class="diff-badge ${q.difficulty}">${q.difficulty}</span>
            </div>
          </div>
          <div class="q-body">
            ${answerHtml}
            <div class="q-actions">
              <button class="toggle-done-btn" onclick="toggleDone('${q.id}', event)">
                ${isDone ? '✓ Completed' : 'Mark as Completed'}
              </button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function toggleDone(id, event) {
    if (event) event.stopPropagation();
    if (doneSet.has(id)) {
      doneSet.delete(id);
    } else {
      doneSet.add(id);
    }
    saveProgress();
    updateStats();
    
    const card = document.getElementById(`card-${id}`);
    if (card) {
      card.classList.toggle('done', doneSet.has(id));
      const chk = card.querySelector('.q-checkbox');
      if (chk) chk.checked = doneSet.has(id);
      const btn = card.querySelector('.toggle-done-btn');
      if (btn) btn.textContent = doneSet.has(id) ? '✓ Completed' : 'Mark as Completed';
    }
  }

  function toggleCard(id) {
    const card = document.getElementById(`card-${id}`);
    if (card) card.classList.toggle('open');
  }

  function copyCode(btn) {
    const codeEl = btn.closest('.code-container').querySelector('code');
    if (codeEl) {
      navigator.clipboard.writeText(codeEl.textContent);
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      btn.style.background = 'var(--green)';
      btn.style.color = '#FFF';
      setTimeout(() => {
        btn.textContent = orig;
        btn.style.background = '';
        btn.style.color = '';
      }, 2000);
    }
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
  }

  function init() {
    loadProgress();
    updateStats();
    renderModulesGrid();

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  }

  window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .quote-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 12px 18px 14px;
      border: 1px solid #E8E8E4;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.05);
      text-align: center;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .quote-card:active {
      transform: scale(0.98);
    }

    .quote-card::before {
      content: '\201C';
      position: absolute;
      top: -4px;
      left: 10px;
      font-size: 56px;
      color: #F97316;
      opacity: 0.15;
      font-family: Georgia, serif;
      line-height: 1;
    }

    .quote-badge {
      font-size: 10px;
      font-weight: 700;
      color: #F97316;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: rgba(249,115,22,0.1);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .quote-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      margin: 4px 0;
      width: 100%;
    }

    .quote-text {
      font-size: 14.5px;
      line-height: 1.45;
      color: #1A1A18;
      font-style: italic;
      padding: 0 4px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .quote-author {
      font-size: 12px;
      color: #F97316;
      font-weight: 700;
      margin-top: 4px;
    }

    .quote-footer {
      font-size: 10.5px;
      color: #A8A8A0;
      font-weight: 500;
    }

    @keyframes fadeQuote {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quote-fade {
      animation: fadeQuote 0.35s ease;
    }
  </style>
</head>

<body>
  <div class="quote-card" id="quote-card" onclick="refreshQuote()">
    <div class="quote-badge" id="quote-badge">💡 Wisdom</div>
    <div class="quote-body">
      <div class="quote-text" id="quote-text"></div>
      <div class="quote-author" id="quote-author"></div>
    </div>
    <div class="quote-footer">✨ Tap to refresh</div>
  </div>

    let currentQuoteIndex = -1;

    function getDailyQuoteIndex() {
      const d = new Date();
      const seed = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
      return seed % QUOTES.length;
    }

    function renderQuote(index) {
      const q = QUOTES[index];
      const card = document.getElementById('quote-card');
      card.classList.remove('quote-fade');
      void card.offsetWidth;
      card.classList.add('quote-fade');
      const badgeEl = document.getElementById('quote-badge');
      if (badgeEl) badgeEl.textContent = `💡 ${q.category || 'Wisdom'}`;
      document.getElementById('quote-text').textContent = `"${q.text}"`;
      document.getElementById('quote-author').textContent = `— ${q.author}`;
      currentQuoteIndex = index;
    }

    function refreshQuote() {
      let next = Math.floor(Math.random() * QUOTES.length);
      while (next === currentQuoteIndex) next = Math.floor(Math.random() * QUOTES.length);
      renderQuote(next);
    }

    // Init — show today's daily quote
    renderQuote(getDailyQuoteIndex());
  </script>

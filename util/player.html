<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music — BeCreator</title>
    <style>
        :root {
            --bg: #0F1117;
            --accent: #6C63FF;
            --green: #00D4AA;
            --text: #FFFFFF;
            --sans: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url('./TeaShop.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            min-height: 100vh;
            color: var(--text);
            font-family: var(--sans);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(15, 17, 23, 0.05) 0%, rgba(15, 17, 23, 0.35) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .nav-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 28px;
            position: relative;
            z-index: 10;
            background: rgba(15, 17, 23, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .nav-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--sans);
            backdrop-filter: blur(8px);
        }

        .nav-back-btn:hover {
            background: rgba(108, 99, 255, 0.45);
            border-color: var(--accent);
            transform: translateX(-2px);
        }

        .nav-title {
            font-weight: 700;
            font-size: 18px;
            color: #FFF;
            letter-spacing: 0.02em;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .header-spacer {
            width: 100px;
        }

        .bottom-wrapper {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
        }

        .transparent-controller {
            background: rgba(18, 20, 29, 0.25);
            border: 1.5px solid rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border-radius: 40px;
            padding: 12px 28px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s ease;
            animation: floatUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .transparent-controller:hover {
            background: rgba(18, 20, 29, 0.35);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), 0 0 30px rgba(108, 99, 255, 0.25);
        }

        @keyframes floatUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #FFF;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(6px);
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(1.1);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .ctrl-btn:active {
            transform: scale(0.92);
        }

        .ctrl-btn-play {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(108, 99, 255, 0.9) 0%, rgba(0, 212, 170, 0.9) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(108, 99, 255, 0.45);
        }

        .ctrl-btn-play:hover {
            background: linear-gradient(135deg, rgba(108, 99, 255, 1) 0%, rgba(0, 212, 170, 1) 100%);
            transform: scale(1.12);
            box-shadow: 0 12px 32px rgba(0, 212, 170, 0.6);
        }

        .ctrl-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .ctrl-icon-large {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }
    </style>
</head>

<body>

    <div class="nav-header">
        <button class="nav-back-btn" onclick="goBack()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span>BeCreator</span>
        </button>
        <div class="nav-title">Music</div>
        <div class="header-spacer"></div>
    </div>

    <div class="bottom-wrapper">
        <div class="transparent-controller">
            <button class="ctrl-btn" onclick="prevTrack()" title="Previous Song">
                <svg class="ctrl-icon" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>
            <button class="ctrl-btn ctrl-btn-play" id="play-btn" onclick="togglePlay()" title="Play / Pause">
                <svg class="ctrl-icon-large" id="play-icon" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z" />
                </svg>
            </button>
            <button class="ctrl-btn" onclick="nextTrack()" title="Next Song">
                <svg class="ctrl-icon" viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Hidden YouTube iframe — sized properly so browser won't throttle it -->
    <iframe id="yt-iframe" frameborder="0" allowfullscreen
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" width="640" height="360"
        style="position:fixed;top:-9999px;left:-9999px;pointer-events:none;"></iframe>

    <script>
        var TRACKS = [
            '5y_TCKNzAMI',
            'CTNgz5gb3D8',
            'CTuvMubzXpU',
            '3NWMK2MRqIk',
            'bga_0ziOOfQ',
            'i1IsLVz6T9Q',
            'otQmzlm-s7Q',
            'tPNwGuu_rQ4'
        ];

        var currentIndex = 0;
        var isPlaying = false;
        var player = null;
        var ORIGIN = 'https://becreator.online';

        function goBack() {
            if (window.parent && typeof window.parent.closeRadioPlayerApp === 'function') {
                window.parent.closeRadioPlayerApp();
            } else {
                window.location.href = '../index.html?tab=utils';
            }
        }

        // Build iframe src exactly like saloon.wtf
        function buildSrc(videoId) {
            return 'https://www.youtube.com/embed/' + videoId
                + '?controls=0'
                + '&disablekb=1'
                + '&playsinline=1'
                + '&rel=0'
                + '&modestbranding=1'
                + '&enablejsapi=1'
                + '&origin=' + encodeURIComponent(ORIGIN)
                + '&forigin=' + encodeURIComponent(ORIGIN + '/')
                + '&aoriginsup=1'
                + '&vf=1'
                + '&autoplay=1';
        }

        function loadTrack(index, autoplay) {
            currentIndex = index;
            var iframe = document.getElementById('yt-iframe');
            var src = buildSrc(TRACKS[currentIndex]);
            if (!autoplay) src = src.replace('&autoplay=1', '&autoplay=0');
            iframe.src = src;
            player = iframe;
        }

        // Listen for player state via postMessage
        window.addEventListener('message', function (e) {
            var data;
            try { data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }

            // YouTube sends info as onStateChange
            if (data.event === 'onStateChange') {
                var state = data.info;
                var icon = document.getElementById('play-icon');
                if (state === 1) { // PLAYING
                    isPlaying = true;
                    icon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                } else if (state === 2) { // PAUSED
                    isPlaying = false;
                    icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                } else if (state === 0) { // ENDED — auto advance
                    nextTrack();
                }
            }

            if (data.event === 'onError') {
                nextTrack();
            }
        });

        function sendCmd(func) {
            var iframe = document.getElementById('yt-iframe');
            if (!iframe || !iframe.contentWindow) return;
            iframe.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: func,
                args: []
            }), '*');
        }

        function togglePlay() {
            if (!isPlaying) {
                // First play — load the track with autoplay
                if (player === null) {
                    loadTrack(0, true);
                } else {
                    sendCmd('playVideo');
                }
            } else {
                sendCmd('pauseVideo');
            }
        }

        function nextTrack() {
            var next = (currentIndex + 1) % TRACKS.length;
            loadTrack(next, true);
            isPlaying = true;
            document.getElementById('play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        function prevTrack() {
            var prev = (currentIndex - 1 + TRACKS.length) % TRACKS.length;
            loadTrack(prev, true);
            isPlaying = true;
            document.getElementById('play-icon').innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }
    </script>
</body>

</html>

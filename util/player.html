<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music — BeCreator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0F1117;
      --surface: rgba(26, 29, 39, 0.55);
      --border: rgba(255, 255, 255, 0.18);
      --accent: #6C63FF;
      --green: #00D4AA;
      --text: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.7);
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-image: url('TeaShop.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    /* DARK OVERLAY VIGNETTE */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 17, 23, 0.2) 0%, rgba(15, 17, 23, 0.65) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* HEADER */
    .nav-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      position: relative;
      z-index: 10;
      background: rgba(15, 17, 23, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 600;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: var(--sans);
      backdrop-filter: blur(10px);
    }

    .nav-back-btn:hover {
      background: rgba(108, 99, 255, 0.4);
      border-color: var(--accent);
      transform: translateX(-2px);
    }

    .nav-title {
      font-weight: 700;
      font-size: 18px;
      color: #FFF;
      letter-spacing: 0.02em;
    }

    .header-spacer { width: 100px; }

    /* CENTER AUDIO CONTROLLER CONTAINER */
    .center-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      width: 100%;
      padding: 20px;
    }

    .transparent-controller {
      background: rgba(18, 20, 29, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px 40px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: floatIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .track-info {
      width: 100%;
    }

    .track-title {
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .track-status {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }

    .playing .status-dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    /* CONTROLS ROW */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFF;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      backdrop-filter: blur(10px);
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.08);
      border-color: rgba(255, 255, 255, 0.4);
    }
    .ctrl-btn:active { transform: scale(0.95); }

    .ctrl-btn-play {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, rgba(108, 99, 255, 0.85) 0%, rgba(0, 212, 170, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 25px rgba(108, 99, 255, 0.4);
    }

    .ctrl-btn-play:hover {
      background: linear-gradient(135deg, rgba(108, 99, 255, 1) 0%, rgba(0, 212, 170, 1) 100%);
      transform: scale(1.1);
      box-shadow: 0 12px 30px rgba(0, 212, 170, 0.5);
    }

    .ctrl-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .ctrl-icon-large {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* FOOTER / CREATOR CREDIT */
    .footer-credit {
      position: relative;
      z-index: 10;
      padding: 16px;
      font-size: 11px;
      font-family: var(--mono);
      color: rgba(255, 255, 255, 0.5);
    }

    #youtube-player { display: none; }
  </style>
</head>
<body>

  <!-- NAV HEADER -->
  <div class="nav-header">
    <button class="nav-back-btn" onclick="goBack()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>BeCreator</span>
    </button>
    <div class="nav-title">Music</div>
    <div class="header-spacer"></div>
  </div>

  <!-- CENTER TRANSPARENT CONTROLLER -->
  <div class="center-wrapper">
    <div class="transparent-controller" id="controller-card">
      <div class="track-info">
        <div class="track-title" id="track-title">Lofi Chill Playlist</div>
        <div class="track-status" id="track-status">
          <span class="status-dot"></span>
          <span id="status-text">Ready to play</span>
        </div>
      </div>

      <div class="controls-row">
        <!-- LAST / PREVIOUS BUTTON -->
        <button class="ctrl-btn" onclick="prevTrack()" title="Previous Song">
          <svg class="ctrl-icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>

        <!-- PLAY / PAUSE BUTTON -->
        <button class="ctrl-btn ctrl-btn-play" id="play-btn" onclick="togglePlay()" title="Play / Pause">
          <svg class="ctrl-icon-large" id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <!-- NEXT BUTTON -->
        <button class="ctrl-btn" onclick="nextTrack()" title="Next Song">
          <svg class="ctrl-icon" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="footer-credit">BeCreator Music Player · Loop Enabled</div>

  <!-- HIDDEN YOUTUBE IFRAME PLAYER -->
  <div id="youtube-player"></div>

  <script>
    let player = null;
    let isPlaying = false;
    const PLAYLIST_ID = 'PLIViRZmtnEnE';

    function goBack() {
      if (window.parent && typeof window.parent.closeRadioPlayerApp === 'function') {
        window.parent.closeRadioPlayerApp();
      } else {
        window.location.href = '../index.html?tab=utils';
      }
    }

    // LOAD YOUTUBE IFRAME API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('youtube-player', {
        height: '0',
        width: '0',
        playerVars: {
          'listType': 'playlist',
          'list': PLAYLIST_ID,
          'autoplay': 0,
          'controls': 0,
          'loop': 1,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    if (window.YT && window.YT.Player) {
      onYouTubeIframeAPIReady();
    }

    function onPlayerReady(event) {
      updateTrackInfo();
    }

    function togglePlay() {
      if (!player) return;
      if (isPlaying) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    }

    function nextTrack() {
      if (player && typeof player.nextVideo === 'function') {
        player.nextVideo();
      }
    }

    function prevTrack() {
      if (player && typeof player.previousVideo === 'function') {
        player.previousVideo();
      }
    }

    function onPlayerStateChange(event) {
      const card = document.getElementById('controller-card');
      const playIcon = document.getElementById('play-icon');
      const statusText = document.getElementById('status-text');

      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        card.classList.add('playing');
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; // Pause SVG
        statusText.textContent = 'Playing';
        updateTrackInfo();
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        card.classList.remove('playing');
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>'; // Play SVG
        statusText.textContent = 'Paused';
      } else if (event.data === YT.PlayerState.BUFFERING) {
        statusText.textContent = 'Loading track...';
      } else if (event.data === YT.PlayerState.ENDED) {
        nextTrack();
      }
    }

    function updateTrackInfo() {
      if (player && typeof player.getVideoData === 'function') {
        const data = player.getVideoData();
        if (data && data.title) {
          document.getElementById('track-title').textContent = data.title;
        }
      }
    }

    function onPlayerError() {
      nextTrack();
    }
  </script>
</body>
</html>
